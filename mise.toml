[tools]
python = "3.13"
uv = "latest"
node = "lts"
"pipx:skills-ref" = "latest"
"pipx:snyk-agent-scan" = "0.6.11"

[tasks.validate]
description = "Validate all skills using skills-ref"
run = "for skill in ./skills/*/; do agentskills validate \"$skill\" || exit 1; done"

[tasks.scan]
description = "Scan all skills with Snyk Agent Scan (needs SNYK_TOKEN)"
run = "snyk-agent-scan scan --ci ./skills"
